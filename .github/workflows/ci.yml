name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fbref_scraper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: espn-scraper/requirements.txt

    - name: Install dependencies
      run: pip install -r espn-scraper/requirements.txt

    - name: Run migrations (Alembic)
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbref_scraper
      run: |
        cd espn-scraper
        alembic upgrade head

    - name: Run tests
      env:
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fbref_scraper
      run: |
        cd espn-scraper
        pytest -v --tb=short

  frontend:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      working-directory: frontend
      run: npm ci

    - name: Build frontend (type-check + Vite)
      working-directory: frontend
      run: npm run build
      env:
        # GitHub Pages publica em https://<owner>.github.io/<repo>/
        VITE_BASE: /${{ github.event.repository.name }}/
        # Defina a variável de repositório PUBLIC_API_URL (Settings →
        # Variables → Actions) com a URL da API publicada (ex.: Railway).
        VITE_API_URL: ${{ vars.PUBLIC_API_URL }}

    - name: Upload Pages artifact
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: actions/upload-pages-artifact@v3
      with:
        path: frontend/dist

  deploy-pages:
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  build:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Lowercase repository name
      run: |
        echo "REPO_NAME=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}

    - name: Build and push
      uses: docker/build-push-action@v5
      with:
        context: ./espn-scraper
        push: true
        tags: |
          ghcr.io/${{ env.REPO_NAME }}:latest
          ghcr.io/${{ env.REPO_NAME }}:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
