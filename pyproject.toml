[project]
name = "futebolbr"
version = "1.1.0"
description = "API para scraping de dados de futebol do FBref, previsões e odds"
authors = [
    {name = "Gledson Crist", email = "Gledsoncrist@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "python-dotenv>=1.0.0",
    "requests>=2.32.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.3.0",
    "pandas>=2.2.0",
    "httpx>=0.28.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "alembic (>=1.19.0,<2.0.0)",
    "redis (>=8.1.0,<9.0.0)",
]

[tool.poetry]
# O pacote real da aplicação é o módulo `app` em fbref-scraper/
packages = [{include = "app", from = "fbref-scraper"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"